name: arn_kasir
description: Aplikasi kasir Android offline dengan manajemen bahan baku berbasis takaran.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

# Versi menggunakan batas caret dan dikunci oleh pubspec.lock setelah `flutter pub get`.
# Paket bertanda (API) memakai API yang ditulis untuk rentang mayor tersebut; lihat docs/STATUS.md.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State, DI, navigasi
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0

  # Database lokal
  drift: ^2.28.0
  sqlite3: '>=2.4.6 <3.0.0'
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.0

  # Gambar menu dan logo
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0

  # Cadangan dan pulihkan (API archive 3.x)
  archive: ^3.6.1
  crypto: ^3.0.6
  file_picker: ^10.3.0

  # Notifikasi, berbagi struk, info aplikasi, grafik, tema dinamis
  flutter_local_notifications: ^19.4.0
  share_plus: ^11.0.0
  package_info_plus: ^8.3.0
  fl_chart: ^1.0.0
  dynamic_color: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.28.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
