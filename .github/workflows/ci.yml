name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analisis dan uji
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ambil dependensi
        run: flutter pub get

      - name: Hasilkan kode Drift
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Hasilkan lokalisasi
        run: flutter gen-l10n

      # Aktifkan setelah `dart format .` dijalankan sekali dan hasilnya di-commit:
      # - name: Periksa format
      #   run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analisis statis
        run: flutter analyze --fatal-infos

      - name: Uji unit dan data
        run: flutter test --reporter=expanded

  build:
    name: Build APK debug
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - name: Build debug APK
        run: flutter build apk --debug
